<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Square Eyes – Payment</title>
  <meta name="description" content="Enter your payment details to complete your purchase on Square Eyes." />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- Header-logo-navigation -->
  <header class="main-header">
    <a href="index.html" class="logo">
      <img src="images/noroff-logo.png" alt="Square Eyes logo" />
    </a>

    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="films.html">Films</a></li>
        <li><a href="cart.html">Cart</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main -->
  <main>

    <!-- Payment page -->
    <section class="product-title">
      <h1>Payment Details</h1>
    </section>

    <!-- Payment form -->
    <section>
      <h2>Enter Your Payment Information</h2>

      <div class="payment-form">

        <!-- Row 1 -->
        <div class="payment-row">
          <div class="payment-field">
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Your Name" aria-label="Name" />
          </div>

          <div class="payment-field">
            <label for="card-number">Card Number</label>
            <input id="card-number" type="text" placeholder="1234 5678 9012 3456" aria-label="Card Number" />
          </div>
        </div>

        <!-- Row 2 -->
        <div class="payment-row">
          <div class="payment-field">
            <label for="expiry">Expiry Date</label>
            <input id="expiry" type="text" placeholder="MM/YY" aria-label="Expiry Date" />
          </div>

          <div class="payment-field">
            <label for="cvc">CVC</label>
            <input id="cvc" type="text" placeholder="123" aria-label="CVC" />
          </div>
        </div>

        <!-- Pay button -->
        <div class="payment-button-wrapper">
          <a href="confirmation.html" class="cta-button">PAY NOW</a>
        </div>

      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-links">
      <a href="#">About</a>
      <a href="#">Support</a>
      <a href="#">Terms</a>
    </div>
    <p>© 2026 Square Eyes</p>
  </footer>

</body>
</html>
