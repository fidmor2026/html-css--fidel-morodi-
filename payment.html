<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Square Eyes | Payment</title>
    <link rel="stylesheet" href="src/css/styles.css" />
  </head>
  <body>

    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="films.html">Films</a></li>
          <li><a href="product.html">Product</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="payment.html">Payment</a></li>
          <li><a href="confirmation.html">Confirmation</a></li>
        </ul>
      </nav>
    </header>

    <main>

      <section class="payment-hero centered">
        <h1>Payment</h1>
        <p>Enter your details to complete your purchase.</p>
      </section>

      <section class="payment-form">

        <form>

          <div class="form-group">
            <label for="name">Full Name</label>
            <input id="name" type="text" placeholder="Your Name" required />
          </div>

          <div class="form-group">
            <label for="card">Card Number</label>
            <input id="card" type="text" placeholder="1234 5678 9012 3456" required />
          </div>

          <div class="form-group">
            <label for="expiry">Expiry Date</label>
            <input id="expiry" type="text" placeholder="MM/YY" required />
          </div>

          <div class="form-group">
            <label for="cvc">CVC</label>
            <input id="cvc" type="text" placeholder="123" required />
          </div>

          <div class="payment-total">
            <p><strong>Total:</strong> $9.99</p>
          </div>

          <a href="confirmation.html" class="cta-button">Confirm Payment</a>

        </form>

      </section>

    </main>

  </body>
</html>
