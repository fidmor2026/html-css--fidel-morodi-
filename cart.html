<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Square Eyes | Cart</title>
    <link rel="stylesheet" href="src/css/styles.css" />
  </head>
  <body>

    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="films.html">Films</a></li>
          <li><a href="product.html">Product</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="payment.html">Payment</a></li>
          <li><a href="confirmation.html">Confirmation</a></li>
        </ul>
      </nav>
    </header>

    <main>

      <section class="cart-hero centered">
        <h1>Your Cart</h1>
        <p>Review your selected film before checkout.</p>
      </section>

      <section class="cart-items">

        <article class="cart-item">
          <img src="src/images/placeholder-film.jpg" alt="Film cover" />

          <div class="cart-info">
            <h2>Film Title</h2>
            <p>Price: $9.99</p>
          </div>
        </article>

        <div class="cart-total">
          <p><strong>Total:</strong> $9.99</p>
          <a href="payment.html" class="cta-button">Proceed to Payment</a>
        </div>

      </section>

    </main>

  </body>
</html>
