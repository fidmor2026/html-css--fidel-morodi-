<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Square Eyes – Cart</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- HEADER -->
  <header class="main-header">
    <a href="index.html" class="logo">
      <img src="images/noroff-logo.png" alt="Square Eyes Logo" />
    </a>

    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="films.html">Films</a></li>
        <li><a href="cart.html">Cart</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main>

    <!-- PAGE TITLE -->
    <section class="product-title">
      <h1>Your Cart</h1>
    </section>

    <!-- CART LAYOUT (same as product layout) -->
    <section>
      <div class="product-layout">

        <!-- IMAGE -->
        <div class="product-image">
          <img src="images/film1.jpg" alt="The Batman" />
        </div>

        <!-- INFO -->
        <div class="product-info">
          <h2>The Batman</h2>

          <p class="product-price">$12.99</p>

          <a href="payment.html" class="cta-button">Proceed to Payment</a>
        </div>

      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-links">
      <a href="#">About</a>
      <a href="#">Support</a>
      <a href="#">Terms</a>
    </div>
    <p>© 2026 Square Eyes</p>
  </footer>

</body>
</html>
